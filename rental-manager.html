<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Contract timeline */

  .ct-dot.active { background: var(--green); border-color: var(--green); }
  .ct-dot.archived { background: var(--surface2); border-color: var(--border2); }
  .ct-dot.draft { background: var(--surface); border-color: var(--border2); }
  .ct-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }

  .ct-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .ct-tenant { font-size: 14px; font-weight: 600; }

<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const EXPENSE_CATS = [
  { key: 'admin', label: 'Admin / mgmt', type: 'auto' },
  { key: 'electricity', label: 'Electricity', type: 'manual' },
  { key: 'water', label: 'Water', type: 'manual' },
  { key: 'gas', label: 'Gas', type: 'manual' },
  { key: 'internet', label: 'Internet', type: 'auto' },
  { key: 'cleaning', label: 'Cleaning', type: 'manual' },
  { key: 'maintenance', label: 'Maintenance', type: 'manual' },
];
const CAPEX_CATS = ['Improvement','Equipment','Repair','Other'];
const INCREMENT_OPTS = [{value:'ipc+',label:'IPC + fixed %'},{value:'ipc',label:'IPC only'},{value:'fixed',label:'Fixed %'},{value:'none',label:'None'}];

const fmt = (n) => {
  if (n === null || n === undefined || n === '') return '—';
  return (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('es-CO');
};
const fmtM = (n) => !n && n !== 0 ? '—' : (Math.round(n/1000000*10)/10)+'M';
const parseNum = (s) => parseFloat(String(s).replace(/[,.\s]/g,'').replace(/(\d{3})$/,'.$1'))||parseFloat(String(s).replace(/[^\d]/g,''))||0;

function contractForMonth(contracts, year, mIdx) {
  const d = new Date(year, mIdx, 15);
  return contracts.find(c => {
    if (c.status === 'draft') return false;
    return d >= new Date(c.startDate) && d <= new Date(c.endDate);
  }) || null;
}

function getMonthData(prop, mIdx) {
  const contract = contractForMonth(prop.contracts, prop.year, mIdx);
  const m = prop.months[mIdx] || { status: 'rented', incomeOverride: null, expenses: {} };
  const rent = contract ? contract.monthlyRent : 0;
  const income = !contract ? 0 : m.status === 'vacant' ? 0 : (m.incomeOverride !== null ? m.incomeOverride : rent);
  const autoExp = contract ? { admin: contract.adminFee||0, internet: contract.internet||0 } : {};
  const manExp = { ...m.expenses };
  const totalOpex = Object.values(autoExp).reduce((a,b)=>a+b,0) + Object.values(manExp).filter(v=>typeof v==='number').reduce((a,b)=>a+b,0);
  return { income, manExp, autoExp, totalOpex, noi: income - totalOpex, status: m.status, incomeOverride: m.incomeOverride, contract };
}

function calcAnnual(prop) {
  let gpi=0, vacancy=0, totalOpex=0;
  for (let i=0;i<12;i++) {
    const c = contractForMonth(prop.contracts, prop.year, i);
    const m = getMonthData(prop, i);
    if (c) gpi += c.monthlyRent;
    if (c && m.status === 'vacant') vacancy += c.monthlyRent;
    else if (c && m.incomeOverride !== null && m.incomeOverride < c.monthlyRent) vacancy += c.monthlyRent - m.incomeOverride;
    totalOpex += m.totalOpex;
  }
  const totalCapex = prop.capex.reduce((a,b)=>a+b.amount,0);
  const taxes = (prop.taxes.predial||0) + (prop.taxes.incomeTax||0);
  const egi = gpi - vacancy;
  const noi = egi - totalOpex;
  return { gpi, vacancy, egi, totalOpex, noi, totalCapex, taxes, netCf: noi - totalCapex - taxes };
}

const activeContract = (prop) => prop.contracts.find(c => c.status === 'active') || null;

// ── Initial data ─────────────────────────────────────────────────────────────
const initProps = () => [
  {
    id: 1, name: 'Apto 102', address: 'Calle 78 #5-32', type: '2-bed', ref: 'AAA0093HHNN', year: 2026,
    contracts: [
      { id: 101, status: 'archived', tenant: 'Carlos Mejía', monthlyRent: 1650000, startDate: '2025-02-01', endDate: '2025-12-31', paymentDay: 2, deposit: 2, increment: 'ipc+', ipcExtra: 1, adminFee: 1200000, internet: 100000, notes: 'First tenant. Left on good terms.' },
      { id: 102, status: 'active', tenant: 'Empresa S.A.S.', monthlyRent: 1808629, startDate: '2026-02-01', endDate: '2027-01-31', paymentDay: 2, deposit: 2, increment: 'ipc+', ipcExtra: 1, adminFee: 1320099, internet: 100000, notes: '' },

// ── New Contract Wizard ───────────────────────────────────────────────────────
function NewContractModal({ prop, onSave, onClose }) {
  const [step, setStep] = useState(1);
  const [form, setForm] = useState({ tenant:'', monthlyRent:'', startDate:'', endDate:'', paymentDay:1, deposit:2, increment:'ipc+', ipcExtra:1, adminFee:'', internet:0, notes:'', activateNow:true });
  const active = activeContract(prop);
  const hasOverlap = active && form.startDate && active.status === 'active' && new Date(form.startDate) <= new Date(active.endDate);
  const valid1 = form.tenant && form.monthlyRent && form.startDate && form.endDate;

  const save = () => {
    const newC = { ...form, id: Date.now(), status: form.activateNow ? 'active' : 'draft', monthlyRent: parseNum(form.monthlyRent), adminFee: parseNum(form.adminFee), internet: parseNum(form.internet) };
    let contracts = [...prop.contracts];
    if (form.activateNow) contracts = contracts.map(c => c.status === 'active' ? {...c, status:'archived'} : c);
    contracts.push(newC);
    onSave(contracts);
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <div><div className="modal-title">New contract — {prop.name}</div><div className="modal-sub">Set up a new rental agreement</div></div>
          <button className="ghost" onClick={onClose} style={{fontSize:'18px',padding:'4px 8px'}}>×</button>
        </div>
        <div className="modal-body">
          <div className="stepper">
            {[['Contract details',1],['Review & activate',2]].map(([label,n],i)=>(
              <React.Fragment key={n}>
                {i>0&&<div className="step-sep"/>}
                <div className={`step-pill${step===n?' active':step>n?' done':''}`}>
                  <div className="step-num">{step>n?'✓':n}</div>{label}
                </div>
              </React.Fragment>
            ))}
          </div>
          {step===1 && <ContractForm value={form} onChange={setForm} />}
          {step===2 && (
            <div>
              {hasOverlap && <div className="warn-box mb16"><strong>Date overlap.</strong> Activating this contract will archive the current one with {active.tenant} (ends {active.endDate}).</div>}
              <div className="card mb16"><div className="card-inner">
                <div className="sec-title mb12">Summary</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 20px'}}>
                  {[['Tenant',form.tenant],['Rent','COP '+parseNum(form.monthlyRent).toLocaleString('es-CO')],['Period',form.startDate+' → '+form.endDate],['Increment',form.increment==='ipc+'?`IPC+${form.ipcExtra}%`:form.increment],['Admin fee','COP '+parseNum(form.adminFee).toLocaleString('es-CO')],['Deposit',form.deposit+' months']].map(([l,v])=>(
                    <div key={l}><div className="fs11 text3 mb4">{l}</div><div className="fs13 fw5">{v}</div></div>
                  ))}
                </div>
              </div></div>
              <label className="flex gap8 align-center fs13" style={{cursor:'pointer'}}>
                <input type="checkbox" checked={form.activateNow} onChange={e=>setForm(p=>({...p,activateNow:e.target.checked}))} />
                Activate immediately {active?`(archives ${active.tenant})`:''}
              </label>
              {!form.activateNow && <div className="info-box mt8">Saved as draft — activate later from the Contracts tab.</div>}
            </div>
          )}
        </div>
        <div className="modal-footer">
          <div>{step>1&&<button className="ghost" onClick={()=>setStep(s=>s-1)}>← Back</button>}</div>
          <div className="flex gap8">
            <button onClick={onClose}>Cancel</button>
            {step<2
              ? <button className="primary" onClick={()=>setStep(2)} disabled={!valid1}>Review →</button>
              : <button className="primary" onClick={save}>{form.activateNow?'Activate contract':'Save as draft'}</button>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Contracts Tab ─────────────────────────────────────────────────────────────
function ContractsTab({ prop, onUpdateProp }) {
  const [newModal, setNewModal] = useState(false);
  const [editModal, setEditModal] = useState(null);
  const [confirmArchive, setConfirmArchive] = useState(null);

  const sorted = [...prop.contracts].sort((a,b)=>new Date(b.startDate)-new Date(a.startDate));

  const archiveContract = (id) => { onUpdateProp(p=>({...p,contracts:p.contracts.map(c=>c.id===id?{...c,status:'archived'}:c)})); setConfirmArchive(null); };
  const activateContract = (id) => onUpdateProp(p=>({...p,contracts:p.contracts.map(c=>c.id===id?{...c,status:'active'}:c.status==='active'?{...c,status:'archived'}:c)}));
  const deleteContract = (id) => { if(window.confirm('Delete this draft?')) onUpdateProp(p=>({...p,contracts:p.contracts.filter(c=>c.id!==id)})); };
  const saveNew = (contracts) => onUpdateProp(p=>({...p,contracts}));
  const saveEdit = (updated) => onUpdateProp(p=>({...p,contracts:p.contracts.map(c=>c.id===updated.id?{...updated,monthlyRent:parseNum(updated.monthlyRent),adminFee:parseNum(updated.adminFee)}:c)}));

  const coverage = MONTHS.map((name,i)=>({ name, contract: contractForMonth(prop.contracts, prop.year, i) }));

  return (
    <div>
      <div className="sec-hdr mb8">
        <span className="sec-title">Coverage — {prop.year}</span>
        <button className="primary" style={{fontSize:'12px',padding:'5px 14px'}} onClick={()=>setNewModal(true)}>+ New contract</button>
      </div>
      <div className="card mb24"><div className="card-inner">
        <div className="month-bar-row mb8">
          {coverage.map(({name,contract},i)=>(
            <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
              <div className="month-bar-seg" style={{background:contract?'#1A6B47':'#E2DED6'}}/>
              <span className="fs11 text3">{name}</span>
            </div>
          ))}
        </div>
        <div className="flex gap16">
          <span className="fs11 text3 flex gap4 align-center"><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#1A6B47'}}></span>Covered</span>
          <span className="fs11 text3 flex gap4 align-center"><span style={{display:'inline-block',width:10,height:10,borderRadius:2,background:'#E2DED6'}}></span>Vacant / no contract</span>
          <span className="fs11 text3 mono" style={{marginLeft:'auto'}}>{coverage.filter(c=>c.contract).length} / 12 months covered</span>
        </div>
      </div></div>

      <div className="sec-hdr mb12"><span className="sec-title">Contract history</span></div>
      <div className="contract-timeline">
        <div className="ct-line"/>
        {sorted.length === 0 && (
          <div className="empty-state"><div className="empty-title">No contracts yet</div><div className="fs12 text3 mt4">Add a contract to start tracking this property</div><button className="primary mt12" onClick={()=>setNewModal(true)}>+ Add first contract</button></div>
        )}
        {sorted.map((c, idx) => {
          const prev = sorted[idx-1];
          const gapExists = prev && new Date(c.endDate) < new Date(prev.startDate);
          return (
            <React.Fragment key={c.id}>
              {gapExists && (
                <div className="ct-gap">
                  <span className="dot vacant" style={{flexShrink:0}}/>
                  <div><div className="fs12 fw5" style={{color:'var(--amber)'}}>Vacancy gap</div><div className="fs11 text3">{c.endDate} → {prev.startDate}</div></div>
                </div>
              )}
              <div className="ct-item">
                <div className={`ct-dot ${c.status}`}/>
                <div className={`ct-card ${c.status==='active'?'active-card':c.status==='draft'?'draft-card':''}`}>
                  <div className="ct-header">
                    <div>
                      <div className="ct-tenant">{c.tenant||'—'}</div>
                      <div className="ct-dates">{c.startDate} → {c.endDate}</div>
                    </div>
                    <span className={`badge ${c.status==='active'?'active-c':c.status==='draft'?'draft-c':'archived-c'}`}>{c.status==='active'?'Active':c.status==='draft'?'Draft':'Archived'}</span>
                  </div>
                  <div className="ct-fields mb8">
                    <div><div className="ct-field-label">Rent</div><div className="ct-field-val">{c.monthlyRent?(c.monthlyRent).toLocaleString('es-CO'):'—'}</div></div>
                    <div><div className="ct-field-label">Admin fee</div><div className="ct-field-val">{c.adminFee?(c.adminFee).toLocaleString('es-CO'):'—'}</div></div>
                    <div><div className="ct-field-label">Increment</div><div className="ct-field-val">{c.increment==='ipc+'?`IPC+${c.ipcExtra}%`:c.increment}</div></div>
                    <div><div className="ct-field-label">Deposit</div><div className="ct-field-val">{c.deposit} mo.</div></div>
                  </div>
                  {c.notes && <div className="info-box mb8 fs11">{c.notes}</div>}
                  <div className="ct-actions">
                    <button className="ghost fs12" onClick={()=>setEditModal(c)}>Edit</button>
                    {c.status==='active' && <button className="warning fs12" onClick={()=>setConfirmArchive(c.id)}>Archive</button>}
                    {c.status==='draft' && <>
                      <button className="primary" style={{fontSize:'12px',padding:'4px 12px'}} onClick={()=>activateContract(c.id)}>Activate</button>
                      <button className="danger fs12" onClick={()=>deleteContract(c.id)}>Delete draft</button>
                    </>}
                    {c.status==='archived' && <button className="ghost fs12" onClick={()=>activateContract(c.id)}>Reactivate</button>}
                  </div>
                </div>
              </div>
            </React.Fragment>
          );
        })}
      </div>

      {confirmArchive && (
        <div className="modal-overlay" onClick={()=>setConfirmArchive(null)}>
          <div className="modal modal-sm" onClick={e=>e.stopPropagation()}>
            <div className="modal-header"><div><div className="modal-title">Archive contract?</div><div className="modal-sub">Property will show vacant until a new contract is added</div></div></div>
            <div className="modal-body"><div className="warn-box">Historical expense data linked to this contract is preserved.</div></div>
            <div className="modal-footer"><button className="ghost" onClick={()=>setConfirmArchive(null)}>Cancel</button><button className="warning" onClick={()=>archiveContract(confirmArchive)}>Archive contract</button></div>
          </div>
        </div>
      )}
      {newModal && <NewContractModal prop={prop} onSave={saveNew} onClose={()=>setNewModal(false)} />}
      {editModal && <EditContractModal contract={editModal} onSave={saveEdit} onClose={()=>setEditModal(null)} />}
    </div>
  );
}

// ── Month Modal ───────────────────────────────────────────────────────────────
function MonthModal({ prop, mIdx, onSave, onClose }) {
  const contract = contractForMonth(prop.contracts, prop.year, mIdx);
  const orig = prop.months[mIdx] || { status:'rented', incomeOverride:null, expenses:{} };
  const [status, setStatus] = useState(orig.status||'rented');
  const [incOverride, setIncOverride] = useState(orig.incomeOverride!==null?String(orig.incomeOverride):'');
  const [expenses, setExpenses] = useState({electricity:0,water:0,gas:0,cleaning:0,maintenance:0,...orig.expenses});
  const [extras, setExtras] = useState([]);

  const autoExp = contract ? {admin:contract.adminFee||0,internet:contract.internet||0} : {};
  const income = !contract?0:status==='vacant'?0:(incOverride!==''?parseNum(incOverride):contract.monthlyRent);
  const totalOpex = Object.values(autoExp).reduce((a,b)=>a+b,0)+Object.values(expenses).reduce((a,b)=>a+(parseFloat(b)||0),0)+extras.reduce((a,b)=>a+(parseFloat(b.amount)||0),0);
  const net = income - totalOpex;

  const save = () => {
    const parsed = {};
    Object.entries(expenses).forEach(([k,v])=>{parsed[k]=parseFloat(String(v).replace(/[^\d.-]/g,''))||0;});
    extras.forEach(e=>{if(e.label) parsed['extra_'+e.id]={label:e.label,amount:parseFloat(e.amount)||0};});
    onSave(mIdx,{status,incomeOverride:incOverride!==''?parseNum(incOverride):null,expenses:parsed});
    onClose();
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <div><div className="modal-title">{MONTHS_FULL[mIdx]} {prop.year} — {prop.name}</div><div className="modal-sub">{contract?`Contract: ${contract.tenant}`:'No contract this month'}</div></div>
          <button className="ghost" onClick={onClose} style={{fontSize:'18px',padding:'4px 8px'}}>×</button>
        </div>
        <div className="modal-body">
          {!contract && <div className="warn-box mb16">No contract covers this month. Add a contract first.</div>}
          <div className="flex gap8 align-center mb16">
            <span className="fs11 text2 fw5">Status:</span>
            {['rented','vacant'].map(s=><button key={s} onClick={()=>setStatus(s)} className={status===s?'primary':''} style={{fontSize:'12px',padding:'4px 12px',borderRadius:'20px',textTransform:'capitalize'}}>{s}</button>)}
          </div>
          {contract && status!=='vacant' && (
            <div className="field mb16">
              <label>Income override (leave blank for contract amount)</label>
              <div className="flex gap8 align-center">
                <input type="text" value={incOverride} onChange={e=>setIncOverride(e.target.value)} placeholder={contract.monthlyRent.toLocaleString('es-CO')} className="input-sm" />
                {incOverride && <button className="ghost fs11" onClick={()=>setIncOverride('')}>Reset</button>}
              </div>
            </div>
          )}
          <div className="sec-title mb8">Expenses</div>
          <table className="exp-table">
            <thead><tr><th>Category</th><th>Type</th><th style={{textAlign:'right'}}>Amount</th></tr></thead>
            <tbody>
              {Object.entries(autoExp).map(([k,v])=>(<tr key={k}><td style={{fontSize:'12px',fontWeight:500}}>{k==='admin'?'Admin / mgmt':'Internet'}</td><td><span className="badge auto">Auto</span></td><td className="exp-auto">{v.toLocaleString('es-CO')}</td></tr>))}
              {EXPENSE_CATS.filter(c=>c.type==='manual').map(cat=>(<tr key={cat.key}><td style={{fontSize:'12px',fontWeight:500}}>{cat.label}</td><td><span className="badge pending">Manual</span></td><td><input type="text" value={expenses[cat.key]||''} onChange={e=>setExpenses(p=>({...p,[cat.key]:e.target.value}))} placeholder="0" className="input-sm" style={{textAlign:'right'}} /></td></tr>))}
              {extras.map(e=>(<tr key={e.id}><td><input type="text" value={e.label} onChange={ev=>setExtras(p=>p.map(x=>x.id===e.id?{...x,label:ev.target.value}:x))} placeholder="Description" className="input-sm"/></td><td><span className="badge" style={{background:'var(--red-bg)',color:'var(--red)'}}>One-off</span></td><td className="flex gap4"><input type="text" value={e.amount} onChange={ev=>setExtras(p=>p.map(x=>x.id===e.id?{...x,amount:ev.target.value}:x))} placeholder="0" className="input-sm" style={{textAlign:'right'}}/><button className="ghost danger" onClick={()=>setExtras(p=>p.filter(x=>x.id!==e.id))} style={{padding:'4px 6px',flexShrink:0}}>×</button></td></tr>))}
            </tbody>
          </table>
          <button className="ghost fs12" onClick={()=>setExtras(p=>[...p,{id:Date.now(),label:'',amount:''}])} style={{color:'var(--purple)'}}>+ One-off expense</button>
        </div>
        <div className="modal-footer">
          <div style={{fontSize:'14px',fontWeight:600,fontFamily:'var(--mono)'}}><span className="text3 fs11">Net: </span><span className={net>=0?'pos':'neg'}>{net>=0?'+':''}{fmt(net)}</span></div>
          <div className="flex gap8"><button onClick={onClose}>Cancel</button><button className="primary" onClick={save}>Save month</button></div>
        </div>
      </div>
    </div>
  );
}

// ── Overview Tab ──────────────────────────────────────────────────────────────
function OverviewTab({ prop, onUpdateProp }) {
  const ann = calcAnnual(prop);
  const [monthModal, setMonthModal] = useState(null);
  const [filter, setFilter] = useState('all');
  const active = activeContract(prop);
  const saveMonth = (mIdx,data) => onUpdateProp(p=>({...p,months:{...p.months,[mIdx]:data}}));

  const months = MONTHS.map((name,i)=>{
    const d = getMonthData(prop,i);
    const m = prop.months[i];
    return { name, i, ...d, hasData:!!m, hasOverride:m?.incomeOverride!=null, hasExpenses:m&&Object.values(m.expenses||{}).some(v=>v>0) };
  });
  const filtered = filter==='all'?months:filter==='vacant'?months.filter(m=>m.status==='vacant'):filter==='override'?months.filter(m=>m.hasOverride):months.filter(m=>!m.hasExpenses&&m.status!=='vacant'&&m.contract);

  return (
    <div>
      <div className="kpi-row mb24">
        <div className="kpi-card"><div className="kpi-label">GPI</div><div className="kpi-value">{fmtM(ann.gpi)}</div><div className="kpi-sub">Gross potential</div></div>
        <div className="kpi-card"><div className="kpi-label">Vacancy</div><div className="kpi-value red">{ann.vacancy>0?'−':''}{fmtM(ann.vacancy)}</div></div>
        <div className="kpi-card"><div className="kpi-label">NOI</div><div className="kpi-value purple">{fmtM(ann.noi)}</div><div className="kpi-sub">After OPEX</div></div>
        <div className="kpi-card"><div className="kpi-label">CAPEX</div><div className="kpi-value red">{ann.totalCapex>0?'−':''}{fmtM(ann.totalCapex)}</div></div>
        <div className="kpi-card"><div className="kpi-label">Net cashflow</div><div className="kpi-value green">{fmtM(ann.netCf)}</div></div>
      </div>

      {active ? (
        <div className="card mb24"><div className="card-inner">
          <div className="flex justify-between align-center mb12">
            <div className="flex align-center gap8"><span className="badge active-c">Active contract</span><span className="fs13 fw6">{active.tenant}</span></div>
            <span className="fs11 text3 mono">{active.startDate} → {active.endDate}</span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:'8px 20px'}}>
            {[['Rent','COP '+(active.monthlyRent||0).toLocaleString('es-CO')],['Admin fee','COP '+(active.adminFee||0).toLocaleString('es-CO')],['Increment',active.increment==='ipc+'?`IPC+${active.ipcExtra}%`:active.increment],['Deposit',`${active.deposit} months`]].map(([l,v])=>(<div key={l}><div className="fs11 text3 mb4">{l}</div><div className="fs13 fw5">{v}</div></div>))}
          </div>
        </div></div>
      ) : (
        <div className="warn-box mb24">No active contract — all months show as vacant. Go to the Contracts tab to add one.</div>
      )}

      <div className="sec-hdr mb8"><span className="sec-title">Monthly entry</span><span className="fs11 text3">Click a month to log expenses</span></div>
      <div className="filter-row">
        {[['all','All'],['pending','Pending'],['vacant','Vacant'],['override','Override']].map(([v,l])=>(
          <button key={v} className={`filter-pill${filter===v?' active':''}`} onClick={()=>setFilter(v)}>{l}</button>
        ))}
      </div>
      <div className="month-grid mb24">
        {filtered.map(m => {
          if (!m.contract) return (
            <div key={m.i} className="month-tile no-contract">
              <div className="mt-header"><span className="mt-month">{m.name}</span><span className="badge archived-c">No contract</span></div>
              <div className="mt-income" style={{color:'var(--text3)'}}>—</div>
              <div className="mt-expense fs11 text3">No coverage</div>
            </div>
          );
          const cls = ['month-tile',m.status==='vacant'?'vacant':m.hasOverride?'has-override':'',m.hasExpenses||m.status==='vacant'?'complete':'pending'].filter(Boolean).join(' ');
          return (
            <div key={m.i} className={cls} onClick={()=>setMonthModal(m.i)}>
              <div className="mt-header"><span className="mt-month">{m.name}</span><span className={`badge ${m.status==='vacant'?'vacant':m.hasOverride?'override':'rented'}`}>{m.status==='vacant'?'Vacant':m.hasOverride?'Override':'Rented'}</span></div>
              <div className="mt-income">{m.status==='vacant'?'—':'+'+fmt(m.income)}</div>
              <div className="mt-expense">OPEX −{fmt(m.totalOpex)}</div>
              <div className="mt-footer"><span className={`mt-net ${m.noi>=0?'pos':'neg'}`}>{m.noi>=0?'+':''}{fmt(m.noi)}</span><span className="fs11 text3">{m.hasExpenses?'Logged':'Pending'}</span></div>
            </div>
          );
        })}
      </div>
      {monthModal!==null && <MonthModal prop={prop} mIdx={monthModal} onSave={saveMonth} onClose={()=>setMonthModal(null)} />}
    </div>
  );
}

            <tr className="indent"><td>− Taxes</td><td><div className="wf-bar"><div className="wf-bar-fill" style={{width:ann.gpi&&ann.taxes?Math.max(1,Math.round(ann.taxes/ann.gpi*100))+'%':'0%',background:'#9B2020'}}></div></div></td><td className={ann.taxes?'neg':'text3'}>{ann.taxes?'−'+fmt(ann.taxes):'—'}</td><td className="text3">—</td><td>{ann.gpi&&ann.taxes?Math.round(ann.taxes/ann.gpi*100)+'%':'—'}</td></tr>

              const mTax=i===11?ann.taxes:0;

                <td className={d.totalOpex?'neg':'text3'}>{d.totalOpex?'−'+fmt(d.totalOpex):'—'}</td>
                <td className={mCapex?'neg':'text3'}>{mCapex?'−'+fmt(mCapex):'—'}</td>
                <td className={d.noi>0?'pos':d.noi<0?'neg':'text3'}>{d.noi!==0?fmt(d.noi):'—'}</td>
                <td className={mTax?'neg':'text3'}>{mTax?'−'+fmt(mTax):'—'}</td>
                <td className={net>0?'pos':net<0?'neg':'text3'}>{net!==0?fmt(net):'—'}</td>
                <td className="mono">{fmt(cumulative)}</td>
              </tr>);
            })}
            <tr className="total-row"><td>Total</td><td></td><td></td><td>{fmt(ann.egi)}</td><td>−{fmt(ann.totalOpex)}</td><td>{ann.totalCapex?'−'+fmt(ann.totalCapex):'—'}</td><td>{fmt(ann.noi)}</td><td>{ann.taxes?'−'+fmt(ann.taxes):'—'}</td><td>{ann.netCf>=0?'+':''}{fmt(ann.netCf)}</td><td>{fmt(ann.netCf)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── OPEX/CAPEX Tab ────────────────────────────────────────────────────────────
function OpexCapexTab({ prop, onUpdateProp }) {
  const [newCapex, setNewCapex] = useState({date:'',desc:'',cat:'Improvement',amount:''});
  const addCapex = () => {
    if(!newCapex.desc||!newCapex.amount) return;
    onUpdateProp(p=>({...p,capex:[...p.capex,{id:Date.now(),...newCapex,amount:parseNum(newCapex.amount)}]}));
    setNewCapex({date:'',desc:'',cat:'Improvement',amount:''});
  };
  return (
    <div>
      <div className="sec-hdr mb12"><span className="sec-title">OPEX by month</span></div>
      <div className="card mb24" style={{overflow:'hidden'}}>
        <table className="cf-table">
          <thead><tr><th>Month</th><th>Admin</th><th>Electricity</th><th>Water</th><th>Gas</th><th>Internet</th><th>Cleaning</th><th>Maintenance</th><th>Total</th></tr></thead>
          <tbody>{MONTHS.map((name,i)=>{
            const c=contractForMonth(prop.contracts,prop.year,i);
            const exp=prop.months[i]?.expenses||{};
            const total=(c?.adminFee||0)+(c?.internet||0)+Object.values(exp).filter(v=>typeof v==='number').reduce((a,b)=>a+b,0);
            return (<tr key={i} className={!c?'no-contract-row':''}>
              <td>{name}</td>
              <td className={c?.adminFee?'':'text3'}>{c?.adminFee?fmt(c.adminFee):'—'}</td>
              <td className={exp.electricity?'':'text3'}>{exp.electricity?fmt(exp.electricity):'—'}</td>
              <td className={exp.water?'':'text3'}>{exp.water?fmt(exp.water):'—'}</td>
              <td className={exp.gas?'':'text3'}>{exp.gas?fmt(exp.gas):'—'}</td>
              <td className={c?.internet?'':'text3'}>{c?.internet?fmt(c.internet):'—'}</td>
              <td className={exp.cleaning?'':'text3'}>{exp.cleaning?fmt(exp.cleaning):'—'}</td>
              <td className={exp.maintenance?'':'text3'}>{exp.maintenance?fmt(exp.maintenance):'—'}</td>
              <td className="fw5">−{fmt(total)}</td>

          })}</tbody>
        </table>
      </div>
      <div className="sec-hdr mb12"><span className="sec-title">CAPEX log</span><span className="fs11 text3">Total: {fmt(prop.capex.reduce((a,b)=>a+b.amount,0))}</span></div>
      <div className="card mb16"><div className="card-inner">
        {prop.capex.length===0 && <div className="empty-state" style={{padding:'24px'}}><div className="empty-title">No CAPEX this year</div></div>}
        {prop.capex.map(c=>(<div key={c.id} className="capex-item">
          <div style={{width:'110px',flexShrink:0}}><div className="fs11 text3">Date</div><div className="fs13 mono">{c.date}</div></div>
          <div style={{flex:1}}><div className="fs11 text3">Description</div><div className="fs13 fw5">{c.desc}</div></div>
          <span className={`badge ${c.cat==='Improvement'?'rented':c.cat==='Equipment'?'override':'pending'}`}>{c.cat}</span>
          <div style={{width:'130px',textAlign:'right'}}><div className="fs11 text3">Amount</div><div className="fs13 fw6 neg">−{fmt(c.amount)}</div></div>
          <button className="ghost danger" onClick={()=>onUpdateProp(p=>({...p,capex:p.capex.filter(x=>x.id!==c.id)}))} style={{padding:'4px 8px'}}>×</button>
        </div>))}
      </div></div>
      <div className="card"><div className="card-inner">
        <div className="sec-title mb12">Add CAPEX</div>
        <div style={{display:'grid',gridTemplateColumns:'130px 1fr 130px 140px auto',gap:'10px',alignItems:'end'}}>
          <div className="field"><label>Date</label><input type="date" value={newCapex.date} onChange={e=>setNewCapex(p=>({...p,date:e.target.value}))}/></div>
          <div className="field"><label>Description</label><input type="text" value={newCapex.desc} placeholder="Renovation" onChange={e=>setNewCapex(p=>({...p,desc:e.target.value}))}/></div>
          <div className="field"><label>Category</label><select value={newCapex.cat} onChange={e=>setNewCapex(p=>({...p,cat:e.target.value}))}>{CAPEX_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
          <div className="field"><label>Amount (COP)</label><input type="text" value={newCapex.amount} placeholder="0" onChange={e=>setNewCapex(p=>({...p,amount:e.target.value}))}/></div>
          <button className="primary" onClick={addCapex}>Add</button>
        </div>
      </div></div>
    </div>
  );
}

// ── Taxes Tab ─────────────────────────────────────────────────────────────────

          <div className="field"><label>Effective rate</label><div style={{padding:'8px 10px',background:'var(--surface2)',borderRadius:'var(--radius-sm)',fontSize:'18px',fontWeight:600,fontFamily:'var(--mono)'}}>{ann.egi>0?((ann.taxes/ann.egi)*100).toFixed(1):0}%</div></div>

          <tbody>
            <tr><td>Predial</td><td></td><td className="neg">{taxes.predial?'−'+fmt(taxes.predial):'—'}</td><td>{ann.egi&&taxes.predial?(taxes.predial/ann.egi*100).toFixed(1)+'%':'—'}</td></tr>
            <tr><td>Income tax</td><td></td><td className="neg">{taxes.incomeTax?'−'+fmt(taxes.incomeTax):'—'}</td><td>{ann.egi&&taxes.incomeTax?(taxes.incomeTax/ann.egi*100).toFixed(1)+'%':'—'}</td></tr>

  );

// ── Add Property ──────────────────────────────────────────────────────────────
function AddPropertyModal({ onSave, onClose }) {
  const [form, setForm] = useState({name:'',address:'',type:'2-bed',ref:'',tenant:'',monthlyRent:'',startDate:'2026-01-01',endDate:'2026-12-31',adminFee:'',internet:'0'});
  const set = (k,v) => setForm(p=>({...p,[k]:v}));
  const save = () => {
    if(!form.name||!form.monthlyRent) return;
    const rent = parseNum(form.monthlyRent);
    onSave({id:Date.now(),name:form.name,address:form.address,type:form.type,ref:form.ref,year:2026,contracts:form.tenant?[{id:Date.now()+1,status:'active',tenant:form.tenant,monthlyRent:rent,startDate:form.startDate,endDate:form.endDate,paymentDay:1,deposit:2,increment:'ipc+',ipcExtra:1,adminFee:parseNum(form.adminFee),internet:parseNum(form.internet),notes:''}]:[],months:{},capex:[],taxes:{predial:0,incomeTax:0}});
    onClose();
  };
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header"><div><div className="modal-title">Add property</div><div className="modal-sub">Unit details and first contract</div></div><button className="ghost" onClick={onClose} style={{fontSize:'18px',padding:'4px 8px'}}>×</button></div>
        <div className="modal-body">

            <div className="field"><label>Unit name *</label><input placeholder="Apto 104" value={form.name} onChange={e=>set('name',e.target.value)}/></div>
            <div className="field" style={{gridColumn:'span 2'}}><label>Address</label><input placeholder="Calle 78 #5-32" value={form.address} onChange={e=>set('address',e.target.value)}/></div>
            <div className="field"><label>Type</label><select value={form.type} onChange={e=>set('type',e.target.value)}><option>Studio</option><option>1-bed</option><option value="2-bed">2-bed</option><option>3-bed</option></select></div>
            <div className="field" style={{gridColumn:'span 2'}}><label>Matricula / reference</label><input value={form.ref} onChange={e=>set('ref',e.target.value)}/></div>
            <div className="divider" style={{gridColumn:'1/-1'}}/>
            <div className="field" style={{gridColumn:'span 2'}}><label>Tenant (optional)</label><input value={form.tenant} onChange={e=>set('tenant',e.target.value)}/></div>
            <div className="field"><label>Monthly rent *</label><input value={form.monthlyRent} onChange={e=>set('monthlyRent',e.target.value)} placeholder="1,800,000"/></div>
            <div className="field"><label>Start date</label><input type="date" value={form.startDate} onChange={e=>set('startDate',e.target.value)}/></div>
            <div className="field"><label>End date</label><input type="date" value={form.endDate} onChange={e=>set('endDate',e.target.value)}/></div>
            <div className="field"><label>Admin fee</label><input value={form.adminFee} onChange={e=>set('adminFee',e.target.value)} placeholder="0"/></div>
          </div>
        </div>
        <div className="modal-footer"><span/><div className="flex gap8"><button onClick={onClose}>Cancel</button><button className="primary" onClick={save}>Add property</button></div></div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [props, setProps] = useState(initProps);
  const [selected, setSelected] = useState('portfolio');
  const [addModal, setAddModal] = useState(false);
  const updateProp = (id,fn) => setProps(ps=>ps.map(p=>p.id===id?fn(p):p));
  const addProp = (p) => { setProps(ps=>[...ps,p]); setSelected(p.id); };
  const activeProp = props.find(p=>p.id===selected);
  return (
    <>
      <div className="sidebar">
        <div className="sidebar-logo"><div className="logo-mark">PropFlow</div><div className="logo-sub">rental manager</div></div>
        <div className="sidebar-section">Portfolio</div>
        <div className={`sidebar-item${selected==='portfolio'?' active':''}`} onClick={()=>setSelected('portfolio')}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="8" y="1" width="5" height="5" rx="1" fill="currentColor"/><rect x="1" y="8" width="5" height="5" rx="1" fill="currentColor"/><rect x="8" y="8" width="5" height="5" rx="1" fill="currentColor"/></svg>
          All properties
        </div>
        <div className="sidebar-section">Properties</div>
        {props.map(p=>{const ac=activeContract(p);return(<div key={p.id} className={`sidebar-item${selected===p.id?' active':''}`} onClick={()=>setSelected(p.id)}><span className={`dot ${ac?'rented':'vacant'}`}/><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</span></div>);})}
        <div className="sidebar-add"><button style={{width:'100%',fontSize:'12px',color:'var(--text3)'}} onClick={()=>setAddModal(true)}>+ Add property</button></div>
        <div className="sidebar-footer"><div>{props.length} properties</div><div style={{marginTop:'2px'}}>{props.filter(p=>!activeContract(p)).length} without active contract</div></div>
      </div>
      {selected==='portfolio'?<PortfolioPage props={props}/>:activeProp?<PropertyPage key={activeProp.id} prop={activeProp} onUpdateProp={(fn)=>updateProp(activeProp.id,fn)}/>:null}
      {addModal&&<AddPropertyModal onSave={addProp} onClose={()=>setAddModal(false)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
